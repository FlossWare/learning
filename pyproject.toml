[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-ai"
version = "0.1"
description = "Feedback detection, experience recording, key-phrase extraction, and strategy reward tracking for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Scot P. Floess", email = "sfloess@gmail.com" },
]
keywords = ["llm", "learning", "feedback", "experience", "thompson-sampling", "bandit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "bandit"]

[project.urls]
Homepage = "https://github.com/FlossWare/learning-ai"
Repository = "https://github.com/FlossWare/learning-ai"
Issues = "https://github.com/FlossWare/learning-ai/issues"

[tool.setuptools.packages.find]
include = ["learning_ai*"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
